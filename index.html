<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendaftaran UKM MULTIMEDIA - IKIP PGRI BOJONEGORO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR UTAMA -->
  <header class="navbar-container">
    <div class="navbar-content">
      <div class="brand">
        <img src="logo.png" alt="Logo UKM MM" class="brand-logo" onError="this.style.display='none';" />
        <span class="brand-name">UKM MULTIMEDIA</span>
      </div>

      <nav class="nav-links">
        <a href="#hero-banner" class="nav-item active">Home</a>
        <a href="#form-section" class="nav-item">Formulir</a>
      </nav>
    </div>
  </header>

  <main class="main-wrapper">
    <!-- HERO BANNER -->
    <section id="hero-banner" class="hero-card-blue">
      <div class="hero-text-content">
        <h1 class="hero-title">UKM MULTIMEDIA 2026</h1>
        <p class="hero-subtitle">
          Wadah Kreatif Mahasiswa Terbesar! Ikuti keseruan produksi video, fotografi, desain grafis, dan pengembangan web bersama keluarga besar UKM MULTIMEDIA IKIP PGRI Bojonegoro.
        </p>
        <a href="#form-section" class="btn-hero-action">Daftar Sekarang</a>
      </div>

      <div class="hero-illustration">
        <img src="fotoo.png" alt="Mascot / Logo UKM MM" class="hero-mascot-img" />
      </div>
    </section>

    <!-- FORM PENDAFTARAN -->
    <section id="form-section" class="form-container-card">
      <h2 class="section-heading">Form Pendaftaran Anggota</h2>

      <form id="formPendaftaran" autocomplete="off">
        <div class="input-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" placeholder="Masukkan nama lengkap" required />
        </div>

        <div class="form-row-3">
          <div class="input-group">
            <label for="nim">NIM</label>
            <input type="text" id="nim" placeholder="Contoh: 2026123001" required />
          </div>

          <div class="input-group">
            <label for="prodi">Program Studi</label>
            <select id="prodi" required>
              <option value="" disabled selected>-- Pilih Prodi --</option>
              <option value="Pendidikan Bahasa & Sastra Indonesia">Pendidikan Bahasa & Sastra Indonesia</option>
              <option value="Pendidikan Bahasa Inggris">Pendidikan Bahasa Inggris</option>
              <option value="Pendidikan Ekonomi">Pendidikan Ekonomi</option>
              <option value="Pendidikan Matematika">Pendidikan Matematika</option>
              <option value="Pendidikan Pancasila dan Kewarganegaraan">Pendidikan Pancasila dan Kewarganegaraan</option>
              <option value="Pendidikan Teknologi Informasi">Pendidikan Teknologi Informasi</option>
            </select>
          </div>

          <div class="input-group">
            <label for="semester">Semester</label>
            <select id="semester" required>
              <option value="" disabled selected>-- Semester --</option>
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
              <option value="Semester 3">Semester 3</option>
              <option value="Semester 4">Semester 4</option>
              <option value="Semester 5">Semester 5</option>
              <option value="Semester 6">Semester 6</option>
              <option value="Semester 7">Semester 7</option>
              <option value="Semester 8">Semester 8</option>
            </select>
          </div>
        </div>

        <div class="form-row-2">
          <div class="input-group">
            <label for="nowa">No. WhatsApp</label>
            <input type="tel" id="nowa" placeholder="08xxxxxxxxxx" required />
          </div>

          <div class="input-group">
            <label for="email">Email Aktif</label>
            <input type="email" id="email" placeholder="nama@email.com" required />
          </div>
        </div>

        <div class="input-group">
          <label for="alamat">Alamat Lengkap</label>
          <input type="text" id="alamat" placeholder="Masukkan alamat domisili saat ini" required />
        </div>

        <div class="input-group">
          <label for="alasan">Alasan Memilih UKM MULTIMEDIA</label>
          <textarea id="alasan" rows="3" placeholder="Tuliskan motivasi dan alasan Anda..." required></textarea>
        </div>

        <button type="submit" class="btn-submit-blue">
          <span>Kirim Pendaftaran</span>
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
